poll_interval_seconds = 10
# Optional: how often the poller logs a periodic summary line, in seconds.
# Set to 0 to disable the periodic summary entirely.
# summary_interval_seconds = 60
# Optional: maximum number of contracts polled concurrently in a single
# `watch --once` run. Defaults to 10. Lower it if Horizon rate-limits you.
# concurrency = 10

[[contracts]]
label       = "My Escrow Contract"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4"
network     = "testnet"
webhook_url = "https://hooks.example.com/my-webhook"
# webhook_secret = "my-secret-token"   # optional: HMAC-SHA256 signature sent as X-TxWatch-Signature header

  [[contracts.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 10000

  # A composite rule; its nested entries are `RuleEntry`, which supports the
  # per-rule `webhook_url` / `severity` / `enabled` overrides.
  [[contracts.rules]]
  type = "All"
    [[contracts.rules.rules]]
    type           = "AdminFunctionCalled"
    function_names = ["set_admin", "upgrade", "initialize"]
    webhook_url    = "https://hooks.example.com/critical-webhook"  # per-rule override
    severity       = "critical"

    [[contracts.rules.rules]]
    type = "TransactionFailed"

  [[contracts.rules]]
  type = "TransactionFailed"

[[contracts]]
label       = "Mainnet Vault"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CAAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQC526"
network     = "mainnet"
webhook_url = "https://hooks.example.com/vault-webhook"

  [[contracts.rules]]
  type = "AnyTransaction"

  [[contracts.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"

  # A composite rule with a disabled nested entry: the config is preserved but
  # the disabled rule is not evaluated.
  [[contracts.rules]]
  type = "All"
    [[contracts.rules.rules]]
    type             = "HighFee"
    threshold_stroops = 100000
    enabled          = false

    [[contracts.rules.rules]]
    type = "AnyTransaction"

# Each [[contracts]] block is independent: rules, webhook_url, and network settings
# apply only to that contract. You can define different webhook receivers and alert
# rules per contract, even if they share the same network.

[[contracts]]
label       = "Mainnet Bridge Gateway"
# Replace with your actual Soroban contract address (56 characters, starts with 'C')
contract_id = "CABAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAEAQCAIBAFNSZ"
# network must be one of: mainnet / testnet / futurenet
network     = "mainnet"
# webhook_url can differ per contract — this allows routing alerts to different endpoints
webhook_url = "https://hooks.example.com/bridge-webhook"
# webhook_secret = "another-secret-token"

  [[contracts.rules]]
  type          = "HighFee"
  threshold_stroops = 100000

  [[contracts.rules]]
  type = "TransactionFailed"

  # SourceAccount rule: alert when called by anyone except the known admin
  [[contracts.rules]]
  type = "All"
  [[contracts.rules.rules]]
  type  = "SourceAccount"
  deny  = ["GAAZI4TCR3TY5OJHCTJC2A4QSY6CJWJH5IAJTGKIN2ER7LBNVKOCCWNA"]
  severity = "warning"

  # Composite rule: alert only when withdraw is called AND amount is large
  [[contracts.rules]]
  type = "All"
  [[contracts.rules.rules]]
  type          = "FunctionCalled"
  function_name = "withdraw"
  [[contracts.rules.rules]]
  type          = "LargeTransfer"
  threshold_xlm = 50000
