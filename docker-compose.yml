services:
  txwatch:
    build: .
    container_name: txwatch-dev
    volumes:
      - ./config/docker-compose.toml:/config/txwatch.toml:ro
      - txwatch-data:/data
    environment:
      RUST_LOG: debug
      TXWATCH_CONFIG: /config/txwatch.toml
    command: watch
    depends_on:
      - webhook
    networks:
      - txwatch

  webhook:
    image: mendhak/http-https-echo:35@sha256:1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
    container_name: webhook-echo
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
    networks:
      - txwatch

volumes:
  txwatch-data:

networks:
  txwatch:
    driver: bridge