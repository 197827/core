image:
  # The image must be built with `--features metrics` for the probes,
  # ServiceMonitor and PrometheusRule below to work.
  repository: ghcr.io/tx-wats/txwatch
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Extra arguments for `txwatch watch` (e.g. ["--dry-run"]).
extraArgs: []

# TxWatch keeps per-contract cursors in memory and in `cursor_file`; running
# more than one replica would send every alert twice. The Deployment always
# runs a single replica with the Recreate strategy.

# Contents of txwatch.toml, mounted at /config/txwatch.toml. Reference
# secrets as ${VAR}; they are resolved from the environment (see `secret`).
# Keep `cursor_file` under /data so it lands on the persistent volume.
config: |
  poll_interval_seconds = 10
  cursor_file = "/data/cursors.json"

  [[contracts]]
  label       = "My Escrow Contract"
  contract_id = "CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4"
  network     = "testnet"
  webhook_url = "https://hooks.example.com/my-webhook"
  webhook_secret = "${WEBHOOK_SECRET}"

    [[contracts.rules]]
    type = "AnyTransaction"

secret:
  # Create a Secret from `values` and expose each key as an env var.
  create: true
  # Or reference an existing Secret instead (create: false).
  existingSecret: ""
  values: {}
    # WEBHOOK_SECRET: change-me
    # SLACK_TOKEN: xoxb-...

env: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 64Mi
  existingClaim: ""

metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

# Time allowed for in-flight webhook deliveries after SIGTERM.
terminationGracePeriodSeconds: 30

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
