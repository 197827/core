apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "txwatch.fullname" . }}
  labels:
    {{- include "txwatch.labels" . | nindent 4 }}
spec:
  # Exactly one replica: cursors are per process, so more would duplicate alerts.
  replicas: 1
  # Recreate so the old pod releases the cursor volume before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "txwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "txwatch.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Time for the preStop SIGINT to drain webhooks and save cursors.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: txwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - watch
            {{- if .Values.metrics.enabled }}
            - --metrics-addr
            - "0.0.0.0:{{ .Values.metrics.port }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: TXWATCH_CONFIG
              value: /config/txwatch.toml
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.secret.existingSecret .Values.secret.create }}
          envFrom:
            - secretRef:
                name: {{ include "txwatch.secretName" . }}
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 15
            failureThreshold: 4
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # txwatch shuts down gracefully on SIGINT (saving cursors); send
                # it before the kubelet's SIGTERM until SIGTERM is handled (issue 17).
                command: ["/bin/sh", "-c", "kill -INT 1; sleep 5"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "txwatch.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "txwatch.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
