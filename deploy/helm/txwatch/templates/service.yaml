{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "txwatch.fullname" . }}
  labels:
    {{- include "txwatch.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "txwatch.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
