version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref on dtolnay/rust-toolchain selects the Rust toolchain version,
      # not the action version. Bumping it breaks the MSRV job.
      - dependency-name: dtolnay/rust-toolchain
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly