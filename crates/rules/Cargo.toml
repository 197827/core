[package]
name    = "txwatch-rules"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Alert rule evaluation and payload construction for TxWatch"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Exposes internal parsers to the fuzz targets in `fuzz/`. Not a public API.
fuzzing = []

[dependencies]
txwatch-config = { path = "../config", version = "0.1.0" }
serde          = { workspace = true }
serde_json     = { workspace = true }
anyhow         = { workspace = true }
chrono         = { workspace = true }
tracing        = { workspace = true }
# Used by production code for commitment hashing and alert-id derivation, not
# only by tests.
sha2           = { workspace = true }
hex            = { workspace = true }

[dev-dependencies]
proptest   = "1"
tokio      = { workspace = true, features = ["macros", "rt"] }
criterion  = { version = "0.8", features = ["html_reports"] }

[[bench]]
name    = "evaluate"
harness = false
