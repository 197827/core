[package]
name    = "txwatch-notifier"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
description = "Webhook delivery with retries and HMAC signing for TxWatch alerts"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
txwatch-rules = { path = "../rules", version = "0.1.0" }
txwatch-config = { path = "../config", version = "0.1.0" }
reqwest       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
tokio         = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing       = { workspace = true }
chrono        = { workspace = true }
hmac          = { workspace = true }
sha2          = { workspace = true }
hex           = { workspace = true }
futures       = { workspace = true }
minijinja     = { workspace = true }

[dev-dependencies]
wiremock      = { workspace = true }
txwatch-config = { path = "../config" }
tokio         = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "registry"] }
tokio         = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
tokio-rustls  = "0.26"
rustls        = "0.23"
